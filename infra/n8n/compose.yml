services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: logplus-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: ${TZ:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
      DB_TYPE: mariadb
      DB_MYSQLDB_HOST: ${N8N_DB_HOST}
      DB_MYSQLDB_PORT: ${N8N_DB_PORT:-3306}
      DB_MYSQLDB_DATABASE: ${N8N_DB_NAME}
      DB_MYSQLDB_USER: ${N8N_DB_USER}
      DB_MYSQLDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./builds:/builds

volumes:
  n8n_data:
