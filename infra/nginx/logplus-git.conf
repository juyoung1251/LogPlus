server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 1g;

    location = /_git_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/internal/git-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /git/info/refs {
        auth_request /_git_auth;
        auth_request_set $git_repo_path $upstream_http_x_git_repo_path;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
        fastcgi_param SCRIPT_NAME /git;
        fastcgi_param PATH_INFO $git_repo_path/info/refs;
        fastcgi_param GIT_PROJECT_ROOT /repos;
        fastcgi_param GIT_HTTP_EXPORT_ALL "1";
        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap-logplus.sock;
        fastcgi_read_timeout 300s;
    }

    location = /git/git-receive-pack {
        auth_request /_git_auth;
        auth_request_set $git_repo_path $upstream_http_x_git_repo_path;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
        fastcgi_param SCRIPT_NAME /git;
        fastcgi_param PATH_INFO $git_repo_path/git-receive-pack;
        fastcgi_param GIT_PROJECT_ROOT /repos;
        fastcgi_param GIT_HTTP_EXPORT_ALL "1";
        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap-logplus.sock;
        fastcgi_read_timeout 300s;
    }

    location = /git/git-upload-pack {
        auth_request /_git_auth;
        auth_request_set $git_repo_path $upstream_http_x_git_repo_path;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
        fastcgi_param SCRIPT_NAME /git;
        fastcgi_param PATH_INFO $git_repo_path/git-upload-pack;
        fastcgi_param GIT_PROJECT_ROOT /repos;
        fastcgi_param GIT_HTTP_EXPORT_ALL "1";
        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap-logplus.sock;
        fastcgi_read_timeout 300s;
    }

    location ^~ /git/ {
        auth_request /_git_auth;

        rewrite ^/git(/.*)$ $1 break;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
        fastcgi_param SCRIPT_NAME /git;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param GIT_PROJECT_ROOT /repos;
        fastcgi_param GIT_HTTP_EXPORT_ALL "1";
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap-logplus.sock;
        fastcgi_read_timeout 300s;
    }
}
